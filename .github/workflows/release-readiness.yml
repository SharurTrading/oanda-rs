name: Release readiness

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version expected in Cargo.toml
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          actual = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          expected = os.environ["EXPECTED_VERSION"]
          if actual != expected:
              raise SystemExit(f"Cargo.toml version {actual!r} does not match {expected!r}")
          PY
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --all-features --locked
      - name: Documentation
        run: RUSTDOCFLAGS='-D warnings' cargo doc --all-features --no-deps --locked
      - name: Coverage ledger
        run: python3 tools/check_coverage.py
      - name: Crate package
        run: cargo package --locked
      - name: Registry dry run
        run: cargo publish --dry-run --locked
