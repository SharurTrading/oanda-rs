name: Release readiness

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version expected in Cargo.toml
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          actual = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          expected = os.environ["EXPECTED_VERSION"]
          if actual != expected:
              raise SystemExit(f"Cargo.toml version {actual!r} does not match {expected!r}")
          PY
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --all-features --locked
      - name: Documentation
        run: RUSTDOCFLAGS='-D warnings' cargo doc --all-features --no-deps --locked
      - name: Coverage ledger
        run: python3 tools/check_coverage.py
      - name: Install cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          fallback: none
          tool: cargo-deny@0.20.2
      - name: Install cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          fallback: none
          tool: cargo-audit@0.22.2
      - name: Dependency and license check
        run: cargo deny --locked check
      - name: Security advisory check
        run: cargo audit --file Cargo.lock --deny warnings
      - name: Crate package
        run: cargo package --locked
      - name: Registry dry run
        run: cargo publish --dry-run --locked
