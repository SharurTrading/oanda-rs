name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --all-features --locked
      - name: Credential-free configuration example
        run: cargo run --example exit_reserve --locked
      - name: Documentation
        run: RUSTDOCFLAGS='-D warnings' cargo doc --all-features --no-deps --locked
      - name: Coverage ledger
        run: python3 tools/check_coverage.py
      - name: Offline Python tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Package verification
        run: cargo package --locked

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95.0"
      - name: Install cargo-deny
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          fallback: none
          tool: cargo-deny@0.20.2
      - name: Install cargo-audit
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          fallback: none
          tool: cargo-audit@0.22.2
      - name: cargo deny --locked check
        run: cargo deny --locked check
      - name: cargo audit
        run: cargo audit --file Cargo.lock --deny warnings

  oanda-release-notes:
    name: OANDA release-note drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for versions beyond the reviewed baseline
        run: python3 tools/check_release_notes.py

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks 8.30.1
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file="${archive}" --directory="${RUNNER_TEMP}" gitleaks
      - name: Scan every reachable commit for secrets
        shell: bash
        run: >-
          "${RUNNER_TEMP}/gitleaks" git
          --no-banner
          --redact
          --log-opts="--all"
          .
