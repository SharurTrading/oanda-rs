[package]
name = "oanda-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT-0"
description = "An async, provider-native Rust client for OANDA's v20 REST API"
repository = "https://github.com/SharurTrading/oanda-rs"
readme = "README.md"
keywords = ["oanda", "trading", "forex", "api-client"]
categories = ["api-bindings", "asynchronous", "network-programming"]

[features]
default = []
live-tests = []

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "time"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "net", "io-util"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
